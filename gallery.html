      @font-face {
        font-family: "Simple";
        src: url(/Ldfcomicsanslight-6dZo.ttf);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Simple";
        background-image: url("https://hirolovesgif.carrd.co/assets/images/image09.jpg?v=3cb58473");
        background-size: cover;
        background-attachment: fixed;
        color: #111;
      }

      .container {
        width: 920px;
        margin: 40px auto;
        background: ghostwhite;
        border: 1px solid #ddd;
      }

      header {
        height: 160px;
        background-image: url("/Untitled\ design\ \(1\).png");
        background-size: cover;
        position: relative;
        border-bottom: 1px solid #ddd;
      }

      header h1 {
        font-family: "kawaii stitch";
        font-size: 32px;
        color: ghostwhite;
        -webkit-text-stroke: 1px #000;
        position: absolute;
        bottom: 16px;
        left: 20px;
        margin: 0;
      }

      nav {
        background: #fff;
        border-bottom: 1px solid #ddd;
        text-align: center;
        padding: 8px 0;
      }

      nav a {
        color: #444;
        text-decoration: none;
        margin: 0 12px;
      }

      .wrapper {
        margin: 40px;
        padding: 60px;
        border: 2px dashed #ccc;
        background: #fff;
        text-align: center;
      }

      .wrapper h2 {
        font-family: SakeMoru;
        font-size: 22px;
        margin-bottom: 10px;
      }

      .wrapper p {
        font-size: 14px;
        color: #666;
      }

      footer {
        border-top: 1px solid #ddd;
        background: #fff;
        text-align: center;
        padding: 10px;
        font-size: 12px;
        color: #666;
      }

  /* Scrollbar styling */
  ::-webkit-scrollbar {
      width: 10px;
      /* Vertical Width */
      height: 10px;
      /* Horizontal Height */
  }

  /* Scrollbar Track Color */
  ::-webkit-scrollbar-track {
      background: transparent;
      border-radius: 0px;
  }

  /* Scrollbar Thumb Color */
  ::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 0px;
      border: 2px solid #000000;
  }

  /* Thumb Hover */
  ::-webkit-scrollbar-thumb:hover {
